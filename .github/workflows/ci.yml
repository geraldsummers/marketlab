name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate deployment scripts
        run: bash -n deploy/*.sh
      - name: Validate social model trainer
        run: |
          python3 -m py_compile social-model/trainer.py social-model/test_trainer.py
          pip install numpy==2.3.2 scikit-learn==1.7.1
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m unittest social-model/test_trainer.py
      - name: Test
        run: ./gradlew check --no-daemon
